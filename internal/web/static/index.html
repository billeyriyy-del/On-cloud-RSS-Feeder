<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Noema">
<title>Noema</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.8l2.5 5.1 5.6.8-4 3.9.9 5.6L12 16.6l-5 2.6.9-5.6-4-3.9 5.6-.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-star-fill" viewBox="0 0 24 24"><path d="M12 3.8l2.5 5.1 5.6.8-4 3.9.9 5.6L12 16.6l-5 2.6.9-5.6-4-3.9 5.6-.8z" fill="currentColor" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 11.5a6 6 0 0 0 12 0M12 17.5v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-listen" viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 6v12M15.5 6v12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5l11 6.5-11 6.5z" fill="currentColor"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 5.5l9 6.5-9 6.5zM18 6v12" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4.5h5.5V10M19.5 4.5L11 13M18 14v4.5a1 1 0 0 1-1 1H5.5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1H10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18" cy="12" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a1.5 1.5 0 0 1 1.5-1.5h4.3l2 2H19a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-audio" viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="3.5" y="13" width="4" height="6.5" rx="1.5" fill="currentColor"/><rect x="16.5" y="13" width="4" height="6.5" rx="1.5" fill="currentColor"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3.5" y="6" width="12" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15.5 10.5l5-3v9l-5-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3.5h7l4 4v13H7z M14 3.5v4h4 M9.5 12h6M9.5 15h6M9.5 18h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13.5l2.2-7.2A1.5 1.5 0 0 1 7.6 5.3h8.8a1.5 1.5 0 0 1 1.4 1l2.2 7.2v4.7a1.5 1.5 0 0 1-1.5 1.5H5.5A1.5 1.5 0 0 1 4 18.2z M4 13.5h4.5l1.2 2h4.6l1.2-2H20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-stack" viewBox="0 0 24 24"><path d="M12 4l8.5 4.5L12 13 3.5 8.5z M3.5 12.5L12 17l8.5-4.5 M3.5 16.5L12 21l8.5-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M18 6l-1.6 1.6M7.6 16.4L6 18M18 18l-1.6-1.6M7.6 7.6L6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-textsize" viewBox="0 0 24 24"><path d="M3.5 18l4.5-12 4.5 12M5.2 13.5h5.6M14 18l3.3-8.5 3.2 8.5M15 15.5h4.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="mark" viewBox="-1.15 -1.15 2.3 2.3"><path id="mark-path" fill="none" stroke="currentColor" stroke-width="0.13" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<a class="skip" href="#list">Skip to stories</a>

<div id="login" class="login" hidden>
  <form class="login-card glass" id="login-form" autocomplete="on">
    <svg class="login-mark" aria-hidden="true"><use href="#mark"/></svg>
    <h1>Noema</h1>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p class="login-error" id="login-error" role="alert"></p>
    <button class="btn-primary" type="submit">Sign in</button>
  </form>
</div>

<div id="app" class="app" hidden>
  <nav id="sidebar" class="sidebar" aria-label="Feeds">
    <div class="side-head">
      <svg class="brand-mark" aria-hidden="true"><use href="#mark"/></svg>
      <span class="brand">Noema</span>
      <button class="icon-btn only-drawer" id="close-sidebar" type="button" aria-label="Close feeds"><svg><use href="#i-close"/></svg></button>
    </div>
    <ul class="views" role="list">
      <li><a href="/?view=unread" data-view="unread" class="view-link"><svg><use href="#i-inbox"/></svg><span>Unread</span><span class="count" id="count-unread"></span></a></li>
      <li><a href="/?view=starred" data-view="starred" class="view-link"><svg><use href="#i-star"/></svg><span>Saved</span><span class="count" id="count-starred"></span></a></li>
      <li><a href="/?view=all" data-view="all" class="view-link"><svg><use href="#i-stack"/></svg><span>All stories</span></a></li>
    </ul>
    <div class="side-section">
      <h2 class="side-title">Feeds</h2>
      <div id="tree" class="tree"></div>
    </div>
    <div class="side-foot">
      <button class="side-btn" id="add-feed" type="button"><svg><use href="#i-plus"/></svg><span>Add feed</span></button>
      <button class="side-btn" id="open-settings" type="button"><svg><use href="#i-gear"/></svg><span>Settings</span></button>
    </div>
  </nav>
  <div class="scrim" id="scrim" hidden></div>

  <section class="listpane" aria-labelledby="list-title">
    <header class="toolbar glass">
      <button class="icon-btn only-drawer" id="open-sidebar" type="button" aria-label="Show feeds" aria-controls="sidebar" aria-expanded="false"><svg><use href="#i-menu"/></svg></button>
      <h1 id="list-title" class="list-title">Unread</h1>
      <div class="toolbar-actions">
        <button class="icon-btn" id="search-toggle" type="button" aria-label="Search (/)"><svg><use href="#i-search"/></svg></button>
        <button class="icon-btn" id="refresh" type="button" aria-label="Refresh (r)"><svg><use href="#i-refresh"/></svg></button>
        <button class="icon-btn" id="mark-all" type="button" aria-label="Mark all as read (Shift+A)"><svg><use href="#i-check"/></svg></button>
      </div>
    </header>
    <form class="searchbar" id="searchbar" role="search" hidden>
      <label class="sr" for="search">Search stories</label>
      <svg aria-hidden="true"><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Search stories" autocomplete="off" enterkeyhint="search">
    </form>
    <div class="ptr" id="ptr" aria-hidden="true"><svg><use href="#i-refresh"/></svg></div>
    <div class="listscroll" id="listscroll">
      <ul id="list" class="list" role="list" aria-labelledby="list-title" tabindex="-1"></ul>
      <div id="list-foot" class="list-foot"></div>
    </div>
  </section>

  <main id="reader" class="reader" aria-label="Story" tabindex="-1">
    <div class="reader-empty" id="reader-empty">
      <svg class="empty-mark" aria-hidden="true"><use href="#mark"/></svg>
      <p>Select a story. Press <kbd>?</kbd> for shortcuts.</p>
    </div>
    <article id="story" class="story" hidden>
      <header class="story-bar glass">
        <button class="icon-btn only-narrow" id="back" type="button" aria-label="Back to stories"><svg><use href="#i-back"/></svg></button>
        <div class="story-actions">
          <button class="icon-btn" id="act-read" type="button" aria-pressed="false"><svg><use href="#i-dot"/></svg></button>
          <button class="icon-btn" id="act-star" type="button" aria-pressed="false"><svg><use href="#i-star"/></svg></button>
          <button class="icon-btn" id="act-listen" type="button" aria-label="Listen (l)"><svg><use href="#i-listen"/></svg></button>
          <button class="icon-btn" id="act-full" type="button" aria-label="Load full article (f)"><svg><use href="#i-doc"/></svg></button>
          <button class="icon-btn" id="act-size" type="button" aria-label="Text size"><svg><use href="#i-textsize"/></svg></button>
          <a class="icon-btn" id="act-open" target="_blank" rel="noopener noreferrer" aria-label="Open original (v)"><svg><use href="#i-external"/></svg></a>
        </div>
      </header>
      <div class="story-body" id="story-body"></div>
    </article>
  </main>
</div>

<div class="player glass" id="player" hidden role="region" aria-label="Listening">
  <div class="player-text"><span class="player-label" id="player-label">Listening</span><span class="player-title" id="player-title"></span></div>
  <button class="icon-btn" id="player-toggle" type="button" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
  <button class="icon-btn" id="player-next" type="button" aria-label="Skip paragraph"><svg><use href="#i-next"/></svg></button>
  <button class="icon-btn" id="player-stop" type="button" aria-label="Stop"><svg><use href="#i-close"/></svg></button>
  <audio id="audio" preload="none"></audio>
</div>

<button class="voice-fab glass" id="voice-fab" type="button" aria-label="Ask Noema (.)" hidden><svg><use href="#i-mic"/></svg></button>
<div class="voice glass" id="voice" hidden role="dialog" aria-modal="false" aria-labelledby="voice-title">
  <div class="voice-head">
    <h2 id="voice-title" class="voice-title">Ask Noema</h2>
    <button class="icon-btn" id="voice-close" type="button" aria-label="Close"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="voice-log" id="voice-log" aria-live="polite"></div>
  <form class="voice-input" id="voice-form">
    <button class="icon-btn mic" id="voice-mic" type="button" aria-label="Speak"><svg><use href="#i-mic"/></svg></button>
    <label class="sr" for="voice-text">Ask something</label>
    <input id="voice-text" type="text" placeholder="“What’s new?”, “read the first one”…" autocomplete="off" enterkeyhint="send">
  </form>
</div>

<div class="sheet-wrap" id="sheet-wrap" hidden>
  <div class="sheet-scrim" id="sheet-scrim"></div>
  <div class="sheet glass" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></div>
</div>

<div class="toast-wrap"><div class="toast glass" id="toast" hidden role="status"><span id="toast-text"></span><button type="button" id="toast-undo">Undo</button></div></div>
<div class="sr" id="announce" aria-live="polite"></div>
</body>
</html>
